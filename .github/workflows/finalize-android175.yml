name: Finish Android175 publication cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-android175.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify publication and remove temporary transfer branch and workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64,json,os,urllib.request,urllib.error
          root='https://api.github.com/repos/myanmar001/miao-pos-releases/'
          def api(path,data=None,method='GET'):
              req=urllib.request.Request(root+path,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:
                  raw=r.read()
                  return json.loads(raw) if raw else None
          metadata=json.loads(base64.b64decode(api('contents/metadata/android-stable.json')['content']))
          assert metadata['latest_build']==175 and metadata['sha256']=='15f23b8552818fdf1c0daceb822b1c15951f26ab267cfb2144ab1a1fe2bc14da'
          assert api('releases/latest')['tag_name']=='v1.0.1+175'
          releases=api('releases?per_page=100')
          apks=[a['name'] for r in releases for a in r['assets'] if a['name'].endswith('.apk')]
          assert sorted(apks)==['MIAO_POS_1.0.1+174_OWNER_CLEANUP_R1.apk','MIAO_POS_1.0.1+175_LOCAL_STORAGE_R1.apk']
          api('git/refs/heads/transfer/android175-apk-20260919',method='DELETE')
          for path in ['.github/workflows/publish-android175.yml','.github/workflows/finalize-android175.yml']:
              file=api('contents/'+path)
              api('contents/'+path,{'sha':file['sha'],'message':'chore: remove completed one-off Android175 publication workflow','branch':'main'},'DELETE')
          print('PUBLIC_TEMPORARY_RELEASE_FILES_REMOVED')
          PY
