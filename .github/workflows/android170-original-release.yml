name: Publish accepted original Android 170 to stable
on:
  push:
    branches: ['release/android170-original-20260914']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-original-android170
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci/android170
          sparse-checkout-cone-mode: true
      - name: Transfer verified original APK and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_APK_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1289863271/0bac0104-762d-42c3-b3e2-585ad96e2134?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-14T15%3A31%3A00Z&rscd=attachment%3B+filename%3DMIAO_POS_1.0.1%2B170_HISTORY_ORDER_RECOVERY_R1.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-14T14%3A30%3A36Z&ske=2026-09-14T15%3A31%3A00Z&sks=b&skv=2018-11-09&sig=IVkgsPJqe%2FR5b3lnPrDO1EXmVaRk25c8wh8Eno9Ql%2BE%3D&jwt=***"
        run: python ci/android170/publish_original170.py
