name: Publish accepted original Android 170 to stable
on:
  push:
    branches: ['release/android170-original-20260914']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-original-android170
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci/android170
          sparse-checkout-cone-mode: true
      - name: Verify attached original APK and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/android170/publish_original170.py
