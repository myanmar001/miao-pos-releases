name: Publish verified old MIAO POS Android 173
on:
  push:
    branches: ['release/android173-20260916']
    paths: ['release173/**', '.github/workflows/release-android173.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Verify original signed APK, publish and update Android stable feed
        working-directory: release173
        env:
          GH_TOKEN: ${{ github.token }}
        run: python publish.py
