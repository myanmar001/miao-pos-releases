name: Publish verified Android 175 and remove old APKs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-android175.yml'
      - 'ci/android175-publication.json'
      - 'ci/publish-android175.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-stable-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified APK, update online metadata, remove pre-174 APKs
        env:
          GH_TOKEN: ${{ github.token }}
          # Temporary URL is scoped to this APK, which the owner authorized publishing.
          APK_TRANSFER_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1289863271/a38cbec6-17a5-4acf-8cf9-a59904d9c5d6?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-09-19T11%3A31%3A00Z&rscd=attachment%3B+filename%3DMIAO_POS_1.0.1%2B175_LOCAL_STORAGE_R1.apk&rsct=application%2Fvnd.android.package-archive&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-09-19T10%3A30%3A30Z&ske=2026-09-19T11%3A31%3A00Z&sks=b&skv=2018-11-09&sig=9QEgn5MCYmZIHlosJ8bPYZXhRl9%2BqzqGrMSyZpfab4c%3D&jwt=***"
        run: python ci/publish-android175.py
