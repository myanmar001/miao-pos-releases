name: Promote verified original Android 167 to stable
on:
  push:
    branches: ['release/android167-original-20260914']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-original-android167
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify original APK and publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib,json,os,time,urllib.request,urllib.error
          repo='myanmar001/miao-pos-releases'
          assert os.environ['GITHUB_REPOSITORY']==repo
          api='https://api.github.com/repos/'+repo
          tag='v1.0.1+167'
          name='MIAO_POS_1.0.1+167_CLOUD_PROFILE_RECOVERY_R1.apk'
          expected='ef13e0b5e82449b951ff5f04aa26386e9392f40662d52045d93894944af6e533'
          size=33537414
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}
          def call(path,method='GET',data=None):
              for attempt in range(4):
                  try:
                      request=urllib.request.Request(api+path,method=method,headers=headers,data=None if data is None else json.dumps(data).encode())
                      with urllib.request.urlopen(request,timeout=30) as response:return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504) or attempt==3:raise
                      time.sleep(2**attempt)
          releases=call('/releases?per_page=100')
          matches=[r for r in releases if r['tag_name']==tag]
          assert len(matches)<=1,'Duplicate target releases'
          body='旧 MIAO POS Android 1.0.1+167 正式版（com.yuepos.app）。\n\n修复企业资料和员工权限刷新时的登录恢复、同步提前超时及 Realtime 地址校验，保留 Cloudflare 主线路与 Vercel 备用线路自动切换。\n\n沿用原签名，覆盖安装保留本地数据；请勿卸载或清除数据。\n\nAPK：'+name+'\n文件大小：'+str(size)+' bytes\nSHA256：'+expected+'\n\n复用原成功构建 34752066230；源提交：3330340c33f57928fe6e2dfa9fed0e410285f14c。\n'
          if matches:
              release=matches[0]
          else:
              release=call('/releases','POST',{'tag_name':tag,'target_commitish':'729d5dfdb2e676c3de385e65119538a436ef0b82','name':'MIAO POS Android 1.0.1+167','body':body,'draft':True,'prerelease':True,'make_latest':'false'})
          assets=call('/releases/'+str(release['id'])+'/assets?per_page=100')
          candidates=[a for a in assets if a['name']==name]
          assert len(candidates)<=1
          if not candidates:
              print(json.dumps({'status':'awaiting_original_apk_attachment','release_id':release['id'],'release_url':release['html_url'],'expected_filename':name,'expected_sha256':expected,'stable_metadata_changed':False}))
          else:
              asset=candidates[0]
              assert asset['state']=='uploaded' and asset['size']==size,'Unexpected APK attachment'
              if asset.get('digest'):assert asset['digest']=='sha256:'+expected,'Attachment digest mismatch'
              class NoRedirect(urllib.request.HTTPRedirectHandler):
                  def redirect_request(self,*args,**kwargs):return None
              request=urllib.request.Request(api+'/releases/assets/'+str(asset['id']),headers=dict(headers,Accept='application/octet-stream'))
              try:
                  with urllib.request.build_opener(NoRedirect).open(request,timeout=60) as response:raw=response.read(size+1)
              except urllib.error.HTTPError as error:
                  if error.code not in (301,302,307,308):raise
                  # Do not forward the repository credential to the asset host.
                  with urllib.request.urlopen(error.headers['Location'],timeout=60) as response:raw=response.read(size+1)
              assert len(raw)==size and hashlib.sha256(raw).hexdigest()==expected,'Original APK byte verification failed'
              if release['draft'] or release['prerelease']:
                  release=call('/releases/'+str(release['id']),'PATCH',{'draft':False,'prerelease':False,'make_latest':'true','body':body})
              print(json.dumps({'status':'stable_original_apk_verified','release_id':release['id'],'release_url':release['html_url'],'asset_id':asset['id'],'download_url':asset['browser_download_url'],'sha256':expected,'stable_metadata_changed':False}))
          PY
